databases:
  - name: careerbridge-db
    plan: free
    databaseName: careerbridge
    user: careerbridge

services:
  - type: web
    name: careerbridge
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn placement_portal.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: careerbridge-db
          property: connectionString
